{% set name = "qbiocode" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/qbiocode-{{ version }}.tar.gz
  sha256: # This will be filled automatically by conda-forge bot

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - qprofiler=qbiocode.apps.qprofiler.cli:main
    - qprofiler-batch=qbiocode.apps.qprofiler.qprofiler_batchmode:main
    - qsage=qbiocode.apps.sage.sage:main

requirements:
  host:
    - python >=3.10,<3.13
    - pip
    - setuptools
  run:
    - python >=3.10,<3.13
    # Core dependencies
    - dill
    - hfda
    - hydra-core
    - ipykernel
    - numpy
    - optuna
    - pandas >=2,<3
    # Qiskit ecosystem
    - qiskit ==2.4.2
    - qiskit-aer ==0.17.2
    - qiskit-algorithms ==0.4.0
    - qiskit-ibm-runtime ==0.44.0
    - qiskit-ibm-transpiler ==0.18.0
    - qiskit-machine-learning ==0.9.1
    # ML and data science
    - scikit-dimension
    - scikit-learn
    - scipy
    - seaborn
    - pytorch
    - tqdm
    - umap-learn
    - xgboost
    # Single-cell and multi-omics tutorials
    - anndata
    - python-igraph
    - leidenalg
    - scanpy
    # Apps extras
    - joblib

test:
  imports:
    - qbiocode
    - qbiocode.data_generation
    - qbiocode.embeddings
    - qbiocode.evaluation
    - qbiocode.learning
    - qbiocode.utils
    - qbiocode.visualization
    - qbiocode.apps.qprofiler
    - qbiocode.apps.sage
  commands:
    - qprofiler --help
    - qsage --help
  requires:
    - pip

about:
  home: https://github.com/IBM/QBioCode
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Quantum machine learning applications for healthcare and life sciences
  description: |
    QBioCode provides a comprehensive suite of computational resources for quantum 
    machine learning applications in healthcare and life science data analysis. 
    It includes tools for benchmarking quantum and classical ML models, analyzing 
    data complexity, and making informed model selection decisions.
    
    Key Features:
    - QProfiler: Automated ML benchmarking with data complexity analysis
    - QSage: Meta-learning tool for intelligent model selection
    - Data Generation: Create artificial datasets with controlled complexity
    - Quantum ML Support: QSVC, PQK, VQC, QNN implementations
    - Classical ML Baselines: RF, SVM, LR, DT, NB, MLP, XGBoost
  doc_url: https://ibm.github.io/QBioCode/
  dev_url: https://github.com/IBM/QBioCode

extra:
  recipe-maintainers:
    - futro  # Filippo Utro
    - krhriss  # Kahn Rhrissorrakrai
    - raubenb  # Bryan Raubenolt

